bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - brand
    reference-location: margin
    citation-location: margin
    footnote-location: margin
    notebook-links: true
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    toc: true
    toc-depth: 2
    number-depth: 2
    colorlinks: true
    # Latin Modern Mono has no Greek, subscript digits or block characters, which
    # appear in printed outputs (mu, sigma, progress bars). DejaVu Sans Mono covers
    # them; it comes from the TeX Live "dejavu" package, which Quarto installs
    # automatically (or run: tlmgr install dejavu).
    monofont: DejaVuSansMono.ttf
    monofontoptions:
      - BoldFont=DejaVuSansMono-Bold.ttf
      - ItalicFont=DejaVuSansMono-Oblique.ttf
      - BoldItalicFont=DejaVuSansMono-BoldOblique.ttf
      - Scale=MatchLowercase
    # Hide code (except cells marked `#| code-fold: false`) and replace
    # browser-only outputs (widgets, Plotly) with a short note.
    filters:
      - tools/pdf-tweaks.lua
    include-in-header:
      - text: |
          \usepackage{mathtools}
    # Notebook figures are PNGs with no physical size, so pandoc scales each one
    # to the full line width. Cap them at 72% of the width / 40% of the height.
    include-before-body:
      - text: |
          \makeatletter
          \renewcommand*\pandocbounded[1]{%
            \sbox\pandoc@box{#1}%
            \Gscale@div\@tempa{0.4\textheight}{\dimexpr\ht\pandoc@box+\dp\pandoc@box\relax}%
            \Gscale@div\@tempb{0.72\linewidth}{\wd\pandoc@box}%
            \ifdim\@tempb\p@<\@tempa\p@\let\@tempa\@tempb\fi
            \ifdim\@tempa\p@<\p@\scalebox{\@tempa}{\usebox\pandoc@box}%
            \else\usebox{\pandoc@box}%
            \fi%
          }
          \makeatother
format-links: [ipynb]
editor:
  render-on-save: true

