project:
  type: book
  #output-dir: docs

book:
  title: "Machine Learning for Mechanical Engineering"
  author: "Mark Fuge"
  date: "09/17/2025"
  page-navigation: true
  page-footer: "Machine Learning for Mechanical Engineers © 2025 by [Mark Fuge and IDEAL Lab Contributors](./index.qmd#sec-contributors) is licensed under [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/)"
  downloads: [pdf]
  chapters:
    - index.qmd
    - part: part1/index.qmd
      chapters:
        - part1/reviewing_supervised_linear_models.ipynb
        - notebooks/cross_validation_linear_regression.ipynb
        - notebooks/supervised_linear_models.ipynb
        - part1/linear_decompositions.ipynb
        - part1/taking_derivatives.ipynb
        - part1/distribution_distance.ipynb
        - part1/introduction_to_inference.ipynb
        - part1/introduction_to_probabilistic_programming.ipynb
    - part: part2/part2.qmd
      chapters:
        - part2/review_neural_networks.ipynb 
        - part2/gen_models/intro_to_GANS.ipynb
        - part2/gen_models/GAN_pitfalls.ipynb
        - part2/gen_models/OT.ipynb
        - part2/gen_models/VAEs.ipynb
        - part2/gen_models/normalizing_flows.ipynb
        - part2/gen_models/continuous_flows.ipynb
        - part2/gen_models/score_matching.ipynb
        - part2/gen_models/diffusion_models.ipynb
        - part2/gen_models/flow_matching.ipynb
        - part2/gen_models/latent_generative_models.ipynb
        - part2/introduction_to_reinforcement_learning.ipynb
        - part2/gen_models/transformers.ipynb
    - part: part3/part3.qmd
      chapters: 
      - part3/active_and_semisupervised_learning.ipynb
    #- looking_forward.qmd
    - references.qmd
    # The problem-set notebooks are listed directly (not via {{< embed >}}):
    # embedding a whole notebook mangles multi-line $$ display math in both
    # the HTML and the PDF output (Quarto 1.7).
    - part: problems/problems.qmd
      chapters:
        - problems/ps1_part1.ipynb
        - problems/ps1_part2.ipynb
        - problems/ps1_part3.ipynb
        - problems/ps2_part1_autodiff.ipynb
        - problems/ps2_part2.ipynb
    - part: notebooks/notebooks.qmd
      number-sections: false
      chapters:
        - notebooks/california_housing_visualization.ipynb
    
  appendices:
    - appendices/helpful_tooling.qmd
    - appendices/exercise_solutions.qmd
    #- appendices/data_preparation.qmd
    #- appendices/course_progression.qmd
    - appendices/review_of_singular_value_decomposition.ipynb
    - appendices/review_of_math_and_computing_foundations.ipynb

bibliography: references.bib

format:
  html:
    theme:
      - cosmo
      - brand
    reference-location: margin
    citation-location: margin
    footnote-location: margin
    notebook-links: true
  pdf:
    documentclass: scrreprt
    pdf-engine: xelatex
    toc: true
    toc-depth: 2
    number-depth: 2
    colorlinks: true
    # Latin Modern Mono has no Greek, subscript digits or block characters, which
    # appear in printed outputs (mu, sigma, progress bars). DejaVu Sans Mono covers
    # them; it comes from the TeX Live "dejavu" package, which Quarto installs
    # automatically (or run: tlmgr install dejavu).
    monofont: DejaVuSansMono.ttf
    monofontoptions:
      - BoldFont=DejaVuSansMono-Bold.ttf
      - ItalicFont=DejaVuSansMono-Oblique.ttf
      - BoldItalicFont=DejaVuSansMono-BoldOblique.ttf
      - Scale=MatchLowercase
    include-in-header:
      - text: |
          \usepackage{mathtools}
format-links: [ipynb]
editor:
  render-on-save: true

