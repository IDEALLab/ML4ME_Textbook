name: ml4me-student
channels:
  - conda-forge
dependencies:
  - python=3.11.8
  - pip

# Deliberately no conda cuda/cudnn packages. GPU support comes entirely from the
# +cu128 PyTorch wheels, which bundle their own CUDA and cuDNN. Installing conda's
# cuda/cudnn alongside them puts a second set of identically-named DLLs in
# Library\bin, which torch adds to the Windows DLL search path (torch/__init__.py).
# The wrong copy then wins and torch fails to import with WinError 127.
